spring:
  application:
    name: practice
  datasource:
    url: jdbc:mysql://localhost:3306/cursos-db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: root
    password: 1234

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
server:
  port: 9095
logging:
  level:
    root: debug
    org.hibernate.SQL: debug